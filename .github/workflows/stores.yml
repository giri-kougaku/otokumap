name: Rebuild supermarket index

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stores
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build store index from OpenStreetMap
        run: node scripts/build-stores.mjs --all-prefectures --out=data/stores.json --strict

      - name: Validate generated data
        run: node scripts/validate.mjs

      - name: Commit changes
        run: |
          git config user.name "OtokuMap Bot"
          git config user.email "otokumap-bot@users.noreply.github.com"
          git add data/stores.json
          if git diff --staged --quiet; then
            echo "No store changes this month."
          else
            git commit -m "chore: rebuild store index $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
